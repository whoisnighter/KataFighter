name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24"
  WAILS_VERSION: "v3.1.0"

jobs:
  # Readers, parsers, language server and generators: vet, tests (corpus, golden, oracle).
  formats:
    name: formats + lsp + tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # ikemen/source: SFF decoder oracle, schemagen staleness test

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            formats/go.sum
            lsp/go.sum
            tools/go.sum
            app/go.sum

      # The Ikemen GO release used as test corpus (pinned + checksummed in
      # tools/fetchcorpus). Cached so CI downloads it once.
      - name: Cache test corpus
        uses: actions/cache@v6
        with:
          path: ikemen/release
          key: ikemen-release-${{ hashFiles('tools/fetchcorpus/main.go') }}
      - name: Fetch test corpus
        working-directory: tools
        run: go run ./fetchcorpus

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l formats lsp tools)
          if [ -n "$out" ]; then echo "Run gofmt on:"; echo "$out"; exit 1; fi

      - name: formats
        working-directory: formats
        run: |
          go vet ./...
          go test ./...

      - name: lsp
        working-directory: lsp
        run: |
          go vet ./...
          go test ./...

      - name: tools
        working-directory: tools
        run: |
          go vet ./...
          go test ./...

  # Desktop app: frontend type-check, Go tests, desktop and browser-mode builds.
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            formats/go.sum
            app/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build desktop app
        working-directory: app
        run: wails3 build

      - name: Check frontend types
        working-directory: app/frontend
        run: npm run check

      - name: Go vet and tests
        working-directory: app
        run: |
          go vet ./...
          go vet -tags server ./...
          go test ./...

      - name: Build browser mode
        working-directory: app
        run: wails3 task common:build:server DEV=true

      - uses: actions/upload-artifact@v7
        with:
          name: katafighter-${{ runner.os }}
          path: app/bin/
          if-no-files-found: error
          retention-days: 7
